<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Stephen Cropper">
    <meta name="description" content="{{description}}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta property="og:title" content="{{title}} | Stephen Cropper">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{canonical}}">
    <meta property="og:site_name" content="Stephen Cropper">
    <meta property="article:published_time" content="{{date_iso}}">
    <meta name="twitter:card" content="summary">
    <title>{{title}} | Stephen Cropper</title>
    <link rel="canonical" href="{{canonical}}">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="/img/earth.ico" type="image/x-icon">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": {{title_json}},
        "description": {{description_json}},
        "datePublished": {{date_iso_json}},
        "url": {{canonical_json}},
        "mainEntityOfPage": {{canonical_json}},
        "author": {
            "@type": "Person",
            "@id": "https://cropper.info/#stephen-cropper",
            "name": "Stephen Cropper",
            "url": "https://cropper.info/"
        }
    }
    </script>
</head>
<body>
    <header class="site-header">
        <p><a href="../index.html">Stephen Cropper</a></p>
    </header>
    <main class="blog-post">
        <article>
            <h1>{{title}}</h1>
            <p class="meta">{{date}}</p>
            {{content}}
        </article>
    </main>
</body>
</html>
